<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GA4 Guide Chat</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --accent:#2f6fde; --line:#e3e6eb; --chip:#eef2fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181d; --card:#1e2229; --ink:#e6e8ec; --muted:#9aa1ad; --accent:#6b9bff; --line:#2c313a; --chip:#262d3a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:18px; margin:0; }
  #who { color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:12px 0; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; white-space:pre-wrap; }
  .me { border-color:var(--accent); }
  .tools { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .tool { background:var(--chip); color:var(--muted); font-size:12px; padding:2px 8px; border-radius:999px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:10px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>GA4 Guide</h1><div id="who">starting…</div></div>
    <button class="ghost" id="new">New conversation</button>
  </header>
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="Ask about the GA4 sample data…" autocomplete="off"><button id="send">Send</button></form>
</main>
<script>
let sessionId = null;
const log = document.getElementById("log"), who = document.getElementById("who");
const q = document.getElementById("q"), send = document.getElementById("send");

function add(cls, text) {
  const d = document.createElement("div"); d.className = cls; d.textContent = text || "";
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function newSession() {
  log.innerHTML = ""; who.textContent = "starting…";
  const r = await fetch("/api/session", { method: "POST" });
  const s = await r.json(); sessionId = s.session_id;
  who.textContent = `user: ${s.user_id} · session: ${sessionId}`;
}

async function ask(text) {
  add("msg me", text);
  const tools = add("tools"), answer = add("msg", "…");
  send.disabled = true; let got = "";
  const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ session_id: sessionId, message: text }) });
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {                                   // read the stream line by line as it arrives
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line) continue;
      const e = JSON.parse(line);
      if (e.type === "tool") { const c = document.createElement("span"); c.className = "tool"; c.textContent = e.name; tools.appendChild(c); }
      if (e.type === "text") { got += e.text; answer.textContent = got; }
      log.scrollTop = log.scrollHeight;
    }
  }
  if (!got) answer.textContent = "(no text answer: check the server log)";
  send.disabled = false;
}

document.getElementById("f").onsubmit = (ev) => { ev.preventDefault(); const t = q.value.trim(); if (t && sessionId) { q.value = ""; ask(t); } };
document.getElementById("new").onclick = newSession;
newSession();
</script>
</body>
</html>
